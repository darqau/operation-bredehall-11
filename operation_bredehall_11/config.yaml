name: "Operation Bredehall 11"
description: "Smart underhållsplanerare för villan – uppgifter, vyer och AI-assistent"
version: "0.3.3"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
slug: "operation_bredehall_11"
startup: application
boot: auto
host_network: false

# Direkt port (som Trafik-Dashboard) — nås via LAN/Tailscale på host:8765.
# Ingress av — undviker trasig CSS/API under HA-proxyn.
ingress: false

webui: "http://[HOST]:[PORT:8765]/"
watchdog: "http://[HOST]:[PORT:8765]/health"
panel_icon: mdi:home-analytics
panel_title: Operation Bredehall

options:
  port: 8765
  app_api_key: ""
  openai_api_key: ""
  google_calendar_credentials: ""
  finance_storage_mode: "local"

schema:
  port: port
  app_api_key: password
  openai_api_key: str?
  google_calendar_credentials: str?
  finance_storage_mode: str?

map:
  - config:rw
  - share:rw

ports:
  8765/tcp: 8765

ports_description:
  8765/tcp: "Webbgränssnitt (LAN/Tailscale). Sätt app_api_key i konfigurationen."
